      margin: 0 auto;
      position: relative;
      z-index: 1;

      margin-bottom: 6px;

      font-size: 1rem;
      font-weight: 600;
      color: var(--ofero-black);
      background-color: var(--ofero-white);
      border: 2px solid rgba(29, 30, 33, 0.08);
      border-radius: 12px;
      outline: none;

      background-position: right 14px center;
      background-size: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: border-color 0.2s ease, opacity 0.3s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }

      opacity: 0.45;
      cursor: not-allowed;
      background-color: var(--ofero-white-soft);
    }

    .select-group select option {
      background-color: var(--ofero-white);
      color: var(--ofero-black);
    }

    .card-container {
      display: none;
    }

    .card-container.visible {
      display: block;
      animation: fadeSlideUp 0.4s ease-out;
    }

    .card {
      background-color: var(--ofero-white);
      border-radius: 16px;
      border: none;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .card:hover {

      transform: translateY(-2px);
    }

      padding: 20px 20px 12px;

      margin-bottom: 4px;

    }

    .card-detail {

      line-height: 1.4;

      text-decoration: none;
      font-weight: 600;
    }

    .card-detail a:hover {

    }

      padding: 12px 20px 20px;
      display: flex;
      gap: 10px;
    }

      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      padding: 14px 12px;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;

    // ── Helper: clear select and set placeholder ──
    function resetSelect(sel, placeholder) {
      while (sel.options.length > 0) {
        sel.remove(0);
      }
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = placeholder;
      sel.appendChild(opt);
    }

    // ── Helper: add option to select ──
    function addOption(sel, value, text) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = text;
      sel.appendChild(opt);
    }

    // ── DOM Elements ──
    const selDepto = document.getElementById('departamento');
    const selCiudad = document.getElementById('ciudad');
    const selTienda = document.getElementById('tienda');
    const cardContainer = document.getElementById('cardContainer');
    const cardName = document.getElementById('cardName');
    const cardLocation = document.getElementById('cardLocation');
    const cardAddress = document.getElementById('cardAddress');
    const cardPhone = document.getElementById('cardPhone');
    const cardDirections = document.getElementById('cardDirections');

    // ── Populate Departamentos ──
    Object.keys(tiendas).sort().forEach(function(depto) {
      addOption(selDepto, depto, depto);
    });

    function hideCard() {
      cardContainer.classList.remove('visible');
    }

    function showCard() {
      cardContainer.classList.remove('visible');
      void cardContainer.offsetWidth;
      cardContainer.classList.add('visible');
    }

    // ── Event: Departamento ──
    selDepto.addEventListener('change', function() {
      resetSelect(selCiudad, 'Selecciona una ciudad');
      resetSelect(selTienda, 'Selecciona una tienda');
      selTienda.disabled = true;
      hideCard();

      var depto = selDepto.value;
      if (!depto) {
        selCiudad.disabled = true;
        return;
      }

      selCiudad.disabled = false;
      Object.keys(tiendas[depto]).sort().forEach(function(ciudad) {
        addOption(selCiudad, ciudad, ciudad);
      });
    });

    // ── Event: Ciudad ──
    selCiudad.addEventListener('change', function() {
      resetSelect(selTienda, 'Selecciona una tienda');
      hideCard();

      var depto = selDepto.value;
      var ciudad = selCiudad.value;
      if (!ciudad) {
        selTienda.disabled = true;
        return;
      }

      selTienda.disabled = false;
      tiendas[depto][ciudad].forEach(function(t, i) {
        addOption(selTienda, i, t.nombre);
      });
    });

    // ── Event: Tienda ──
    selTienda.addEventListener('change', function() {
      var depto = selDepto.value;
      var ciudad = selCiudad.value;
      var idx = selTienda.value;

      if (idx === '') {
        hideCard();
        return;
      }

      var t = tiendas[depto][ciudad][idx];
      cardName.textContent = t.nombre;
      cardLocation.textContent = ciudad + ' \u00b7 ' + depto;
      cardAddress.textContent = t.direccion;
      cardPhone.textContent = t.telefonoDisplay;
      cardPhone.href = 'tel:+57' + t.telefono;

      var query = encodeURIComponent(t.direccion + ', ' + ciudad + ', Colombia');
      cardDirections.href = 'https://www.google.com/maps/search/?api=1&query=' + query;

      showCard();
    });
  </script>
